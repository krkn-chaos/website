name: Hugo Build Check

# Fails the PR if any generated page or shortcode does not render.
# Mirrors the Netlify production build (see netlify.toml).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Test stable Operator version lookup
        run: npm run test:krkn-operator-version
      - name: Check Operator documentation integrity
        run: npm run check:operator-docs
      - name: Test Operator documentation helpers
        run: npm run test:operator-docs
      - name: Install Netlify-pinned Hugo for generated-site regression checks
        run: |
          mkdir -p "$RUNNER_TEMP/hugo-netlify"
          curl --fail --location --retry 3 \
            https://github.com/gohugoio/hugo/releases/download/v0.146.0/hugo_extended_0.146.0_linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/hugo-netlify/hugo.tar.gz"
          # Pinned from Hugo v0.146.0's official release checksums.
          printf '%s  %s\n' \
            'ff7bbad837f5dfc403f5e2e1c656533bdf3ec102a303d13f77facd9192a4eb2a' \
            "$RUNNER_TEMP/hugo-netlify/hugo.tar.gz" | shasum -a 256 -c
          tar -xzf "$RUNNER_TEMP/hugo-netlify/hugo.tar.gz" -C "$RUNNER_TEMP/hugo-netlify"
      - name: Test generated Operator documentation site with Netlify Hugo
        run: npm run test:operator-docs:site
        env:
          HUGO_BIN: ${{ runner.temp }}/hugo-netlify/hugo
      - name: Build site
        run: npm run build:production
        env:
          HUGO_CACHEDIR: /tmp/hugo-cache
