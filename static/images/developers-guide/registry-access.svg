<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1025" viewBox="0 0 1100 1025" role="img" aria-labelledby="title desc">
<title id="title">One registry, two independent clients</title><desc id="desc">Podman pushes through localhost port 5001, mapped to NodePort 30500. In the management cluster, the operator uses HTTP settings for metadata while containerd uses hosts.toml and an image pull secret for image pulls. The scenario Pod uses the selected target kubeconfig to reach a separate target API.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#466179"/></marker></defs>
<style>text{font-family:Inter,Arial,sans-serif;fill:#172d42}.label{font-size:20px;font-weight:700;letter-spacing:2px;fill:#9f273a}.heading{font-size:25px;font-weight:700}.body{font-size:22px;fill:#40566a}.small{font-size:20px;fill:#40566a}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:21px;fill:#25435d}.line{fill:none;stroke:#466179;stroke-width:2.5;marker-end:url(#arrow)}</style>
<rect width="1100" height="1025" rx="16" fill="#ffffff"/>
<rect x="24" y="24" width="1052" height="174" rx="12" fill="#f7f9fc" stroke="#ccd7e1" stroke-width="1.5"/>
<text x="48" y="59" class="label" text-anchor="start">WORKSTATION</text>
<rect x="48" y="78" width="340" height="98" rx="12" fill="#ffffff" stroke="#ccd7e1" stroke-width="1.5"/>
<text x="70" y="115" class="heading" text-anchor="start">Podman push</text>
<text x="70" y="149" class="body" text-anchor="start">--tls-verify=false</text>
<rect x="678" y="78" width="370" height="98" rx="12" fill="#ffffff" stroke="#ccd7e1" stroke-width="1.5"/>
<text x="700" y="115" class="heading" text-anchor="start">localhost:5001</text>
<text x="700" y="149" class="body" text-anchor="start">Kind host port mapping</text>
<path d="M388 127H670" class="line"/>
<text x="528" y="113" class="small" text-anchor="middle">image + credentials</text>
<path d="M863 176V322" class="line"/>
<text x="838" y="229" class="small" text-anchor="end">5001 → 30500</text>
<rect x="24" y="260" width="1052" height="576" rx="12" fill="#edf4fa" stroke="#b6cede" stroke-width="1.5"/>
<text x="48" y="297" class="label" text-anchor="start">KIND MANAGEMENT CLUSTER</text>
<rect x="48" y="330" width="350" height="124" rx="12" fill="#ffffff" stroke="#ccd7e1" stroke-width="1.5"/>
<text x="70" y="367" class="heading" text-anchor="start">A. Operator</text>
<text x="70" y="401" class="body" text-anchor="start">Discover tags + inputs</text>
<text x="70" y="430" class="body" text-anchor="start">Allow Insecure HTTP</text>
<rect x="48" y="505" width="350" height="124" rx="12" fill="#ffffff" stroke="#ccd7e1" stroke-width="1.5"/>
<text x="70" y="542" class="heading" text-anchor="start">B. Containerd</text>
<text x="70" y="576" class="body" text-anchor="start">Pull image for kubelet</text>
<text x="70" y="605" class="body" text-anchor="start">HTTP in hosts.toml</text>
<rect x="704" y="330" width="344" height="299" rx="12" fill="#ffffff" stroke="#ccd7e1" stroke-width="1.5"/>
<text x="726" y="368" class="heading" text-anchor="start">Private registry</text>
<text x="726" y="405" class="mono" text-anchor="start">node-name:30500</text>
<text x="726" y="446" class="body" text-anchor="start">Same repository + tag</text>
<text x="726" y="477" class="body" text-anchor="start">Same credentials</text>
<text x="726" y="531" class="body" text-anchor="start">Helm + NodePort</text>
<text x="726" y="562" class="body" text-anchor="start">HTTP + authentication</text>
<text x="726" y="603" class="small" text-anchor="start">Stable node hostname</text>
<path d="M398 390H696" class="line"/>
<text x="551" y="367" class="small" text-anchor="middle">metadata API</text>
<text x="551" y="419" class="small" text-anchor="middle">registry credentials</text>
<path d="M398 565H696" class="line"/>
<text x="551" y="542" class="small" text-anchor="middle">manifest + layers</text>
<text x="551" y="594" class="small" text-anchor="middle">image pull secret</text>
<path d="M223 629V686" class="line"/>
<text x="251" y="668" class="small" text-anchor="start">start runner</text>
<rect x="48" y="696" width="350" height="116" rx="12" fill="#ffffff" stroke="#ccd7e1" stroke-width="1.5"/>
<text x="70" y="733" class="heading" text-anchor="start">Scenario Pod</text>
<text x="70" y="767" class="body" text-anchor="start">/home/krkn/run.sh</text>
<text x="70" y="796" class="body" text-anchor="start">Target kubeconfig mounted</text>
<text x="702" y="711" class="heading" text-anchor="middle">Discovery can succeed</text>
<text x="702" y="745" class="heading" text-anchor="middle">while the image pull fails.</text>
<text x="702" y="786" class="small" text-anchor="middle">Configure A and B independently.</text>
<path d="M398 758H430V935H696" class="line"/>
<text x="415" y="882" class="small" text-anchor="end">target API</text>
<rect x="704" y="875" width="344" height="115" rx="12" fill="#fff6f3" stroke="#ccd7e1" stroke-width="1.5"/>
<text x="726" y="912" class="heading" text-anchor="start">Your target cluster</text>
<text x="726" y="946" class="body" text-anchor="start">Supplied by the user</text>
<text x="726" y="975" class="body" text-anchor="start">Namespace + pod reads</text>
<text x="48" y="999" class="small" text-anchor="start">The target does not pull this scenario image; the management node does.</text>
</svg>
